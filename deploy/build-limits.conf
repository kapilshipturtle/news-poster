# Drop-in for news-reel-build.service and news-reel-hi-build.service (installed by setup_vm.sh).
# Live 2026-10-25: one runaway ffmpeg (789 MB) ran the 1 GB VM out of memory and it lost its network for 80 min.
# A build may use 600 MB before it is pushed to swap, never more than 900 MB RAM + 1 GB swap, and is the first thing
# the kernel kills: a runaway ends that build, never the VM.
[Service]
MemoryHigh=600M
MemoryMax=900M
MemorySwapMax=1G
OOMScoreAdjust=600
